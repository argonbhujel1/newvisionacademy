{% include "admin/_layout_start.html" %}
<h4 class="mb-4">Principal Message</h4>
<form method="POST" enctype="multipart/form-data">
<div class="row g-3">
<div class="col-md-6"><label class="form-label">Name</label><input type="text" name="name" class="form-control" value="{{ principal.name }}"></div>
<div class="col-md-6"><label class="form-label">Designation</label><input type="text" name="designation" class="form-control" value="{{ principal.designation }}"></div>
<div class="col-12"><label class="form-label">Short Message (homepage)</label><textarea name="short_message" class="form-control" rows="3">{{ principal.short_message }}</textarea></div>
<div class="col-12"><label class="form-label">Full Message</label><textarea name="full_message" class="form-control" rows="6">{{ principal.full_message }}</textarea></div>
<div class="col-md-6"><label class="form-label">Photo</label><input type="file" name="photo" class="form-control" accept="image/*">{% if principal.photo_url %}<img src="{{ principal.photo_url }}" height="60" class="mt-1 rounded-circle">{% endif %}</div>
<div class="col-md-6"><div class="form-check mt-4"><input type="checkbox" name="is_active" class="form-check-input" id="pa" {% if principal.is_active %}checked{% endif %}><label for="pa" class="form-check-label">Active</label></div></div>
<div class="col-12"><button type="submit" class="btn btn-primary">Save</button></div>
</div></form>
{% include "admin/_layout_end.html" %}
