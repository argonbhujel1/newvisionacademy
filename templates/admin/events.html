{% include "admin/_layout_start.html" %}
<h4 class="mb-4">Events</h4>
<div class="row g-4">
<div class="col-lg-5"><div class="stat-card">
<form method="POST" enctype="multipart/form-data">
<input type="hidden" name="action" value="add">
<input type="text" name="name" class="form-control mb-2" placeholder="Event name" required>
<textarea name="description" class="form-control mb-2" rows="2"></textarea>
<input type="date" name="event_date" class="form-control mb-2">
<input type="text" name="start_time" class="form-control mb-2" placeholder="Start e.g. 10:00 AM">
<input type="text" name="end_time" class="form-control mb-2" placeholder="End">
<input type="text" name="venue" class="form-control mb-2" placeholder="Venue">
<input type="text" name="organizer" class="form-control mb-2" placeholder="Organizer">
<select name="status" class="form-select mb-2"><option value="upcoming">Upcoming</option><option value="ongoing">Ongoing</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select>
<input type="file" name="image" class="form-control mb-2" accept="image/*">
<div class="form-check mb-2"><input type="checkbox" name="is_active" checked class="form-check-input" id="ea"><label for="ea">Active</label></div>
<button type="submit" class="btn btn-primary btn-sm">Add Event</button>
</form></div></div>
<div class="col-lg-7">
{% for e in events %}
<div class="stat-card mb-2 d-flex justify-content-between">
<div><strong>{{ e.name }}</strong> <span class="badge bg-secondary">{{ e.status }}</span><br><small class="text-muted">{% if e.event_date %}{{ e.event_date.strftime('%d %b %Y') }}{% endif %}</small></div>
<form method="POST" onsubmit="return confirm('Delete?')"><input type="hidden" name="action" value="delete"><input type="hidden" name="id" value="{{ e.id }}"><button class="btn btn-sm btn-outline-danger">Delete</button></form>
</div>
{% else %}<p class="text-muted">No events.</p>{% endfor %}
</div></div>
{% include "admin/_layout_end.html" %}
