{% include "admin/_layout_start.html" %}
<h4 class="mb-4">Coordinator Message</h4>
<form method="POST" enctype="multipart/form-data">
<div class="row g-3">
<div class="col-md-6"><label class="form-label">Name</label><input type="text" name="name" class="form-control" value="{{ coordinator.name }}"></div>
<div class="col-md-6"><label class="form-label">Designation</label><input type="text" name="designation" class="form-control" value="{{ coordinator.designation }}"></div>
<div class="col-12"><label class="form-label">Message</label><textarea name="message" class="form-control" rows="6">{{ coordinator.message }}</textarea></div>
<div class="col-md-6"><label class="form-label">Photo</label><input type="file" name="photo" class="form-control" accept="image/*">{% if coordinator.photo_url %}<img src="{{ coordinator.photo_url }}" height="60" class="mt-1 rounded-circle">{% endif %}</div>
<div class="col-md-6"><div class="form-check mt-4"><input type="checkbox" name="is_active" class="form-check-input" id="ca" {% if coordinator.is_active %}checked{% endif %}><label for="ca" class="form-check-label">Active</label></div></div>
<div class="col-12"><button type="submit" class="btn btn-primary">Save</button></div>
</div></form>
{% include "admin/_layout_end.html" %}
