{% include "admin/_layout_start.html" %}
<h4 class="mb-4">Facilities</h4>
<div class="row g-4">
<div class="col-lg-4"><div class="stat-card">
<form method="POST" enctype="multipart/form-data">
<input type="hidden" name="action" value="add">
<input type="text" name="title" class="form-control mb-2" placeholder="Title" required>
<textarea name="description" class="form-control mb-2" rows="2" placeholder="Description"></textarea>
<input type="text" name="icon" class="form-control mb-2" placeholder="FA icon e.g. fa-book" value="fa-building">
<input type="number" name="sort_order" class="form-control mb-2" value="0">
<input type="file" name="image" class="form-control mb-2" accept="image/*">
<div class="form-check mb-2"><input type="checkbox" name="is_active" checked class="form-check-input" id="fa"><label for="fa">Active</label></div>
<button type="submit" class="btn btn-primary btn-sm">Add</button>
</form></div></div>
<div class="col-lg-8">
{% for f in facilities %}
<div class="stat-card mb-2 d-flex justify-content-between"><div><i class="fas {{ f.icon }} me-2"></i><strong>{{ f.title }}</strong></div>
<form method="POST" onsubmit="return confirm('Delete?')"><input type="hidden" name="action" value="delete"><input type="hidden" name="id" value="{{ f.id }}"><button class="btn btn-sm btn-outline-danger">Delete</button></form>
</div>
{% endfor %}
</div></div>
{% include "admin/_layout_end.html" %}
