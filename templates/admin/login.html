<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login – New Vision Academy</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#0a2540,#1e4d8c);min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-card{background:#fff;border-radius:16px;padding:2.5rem;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-card h2{color:#0a2540;font-weight:700}
.btn-login{background:#1e4d8c;border:none;padding:.7rem;font-weight:600}
.btn-login:hover{background:#0a2540}
</style>
</head>
<body>
<div class="login-card">
<h2 class="mb-1">Admin Panel</h2>
<p class="text-muted mb-4">New Vision Academy</p>
{% with messages = get_flashed_messages(with_categories=true) %}
{% for cat, msg in messages %}<div class="alert alert-{{ cat }} py-2">{{ msg }}</div>{% endfor %}
{% endwith %}
<form method="POST">
<div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" required autofocus></div>
<div class="mb-4"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
<button type="submit" class="btn btn-primary btn-login w-100">Sign In</button>
</form>
<p class="text-center mt-3 mb-0"><a href="/" class="text-muted small">← Back to website</a></p>
</div>
</body>
</html>
