{% include "admin/_layout_start.html" %}
<h4 class="mb-4">Notices</h4>
<div class="stat-card mb-4">
<form method="POST" class="row g-2 align-items-end">
<input type="hidden" name="action" value="ticker">
<div class="col-auto"><div class="form-check"><input type="checkbox" name="is_enabled" class="form-check-input" id="te" {% if ticker.is_enabled %}checked{% endif %}><label for="te">Enable Ticker</label></div></div>
<div class="col-auto"><label class="form-label small mb-0">Speed (sec)</label><input type="number" name="speed" value="{{ ticker.speed }}" class="form-control form-control-sm" style="width:80px"></div>
<div class="col-auto"><label class="form-label small mb-0">Max items</label><input type="number" name="max_items" value="{{ ticker.max_items }}" class="form-control form-control-sm" style="width:80px"></div>
<div class="col-auto"><button type="submit" class="btn btn-sm btn-secondary">Save Ticker</button></div>
</form>
</div>
<div class="row g-4">
<div class="col-lg-5"><div class="stat-card">
<form method="POST">
<input type="hidden" name="action" value="add">
<input type="text" name="title" class="form-control mb-2" placeholder="Title" required>
<textarea name="description" class="form-control mb-2" rows="3" placeholder="Description"></textarea>
<input type="text" name="category" class="form-control mb-2" value="General">
<input type="text" name="external_url" class="form-control mb-2" placeholder="External URL">
<input type="date" name="expiry_date" class="form-control mb-2">
<div class="form-check"><input type="checkbox" name="is_important" class="form-check-input" id="ni"><label for="ni">Important</label></div>
<div class="form-check mb-2"><input type="checkbox" name="is_active" checked class="form-check-input" id="na"><label for="na">Active</label></div>
<button type="submit" class="btn btn-primary btn-sm">Add Notice</button>
</form></div></div>
<div class="col-lg-7">
{% for n in notices %}
<div class="stat-card mb-2 d-flex justify-content-between">
<div>{% if n.is_important %}<span class="badge bg-danger">Important</span>{% endif %} <strong>{{ n.title }}</strong><br><small class="text-muted">{{ format_date(n.published_at) }}</small></div>
<form method="POST" onsubmit="return confirm('Delete?')"><input type="hidden" name="action" value="delete"><input type="hidden" name="id" value="{{ n.id }}"><button class="btn btn-sm btn-outline-danger">Delete</button></form>
</div>
{% else %}<p class="text-muted">No notices.</p>{% endfor %}
</div></div>
{% include "admin/_layout_end.html" %}
