{% extends "base.html" %}
{% block content %}
<section class="page-banner"><div class="container"><h1>Facilities</h1>
<nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="{{ url_for('index') }}">Home</a></li><li class="breadcrumb-item active">Facilities</li></ol></nav></div></section>
<section class="section"><div class="container">
<div class="row g-4">
{% for f in facilities %}
<div class="col-md-6 col-lg-4">
<div class="card-modern p-4 h-100">
<div class="card-icon"><i class="fas {{ f.icon or 'fa-building' }}"></i></div>
<h5>{{ f.title }}</h5>
<p class="text-muted">{{ f.description }}</p>
{% if f.image_url %}<img src="{{ f.image_url }}" class="rounded mt-2 w-100" style="height:160px;object-fit:cover" alt="{{ f.title }}" loading="lazy">{% endif %}
</div></div>
{% else %}<p class="text-center text-muted">Facilities information will be updated soon.</p>{% endfor %}
</div></div></section>
{% endblock %}
