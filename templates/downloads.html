{% extends "base.html" %}
{% block content %}
<section class="page-banner"><div class="container"><h1>Downloads</h1>
<nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="{{ url_for('index') }}">Home</a></li><li class="breadcrumb-item active">Downloads</li></ol></nav></div></section>
<section class="section"><div class="container">
{% for d in downloads %}
<div class="card-modern p-3 mb-3 d-flex justify-content-between align-items-center">
<div><h6 class="mb-1">{{ d.title }}</h6><p class="small text-muted mb-0">{{ d.description }}</p></div>
{% if d.file_url %}<a href="{{ d.file_url }}" target="_blank" class="btn btn-sm btn-primary-custom"><i class="fas fa-download me-1"></i> Download</a>{% endif %}
</div>
{% else %}<p class="text-center text-muted">No downloads available yet.</p>{% endfor %}
</div></section>
{% endblock %}
