{% extends "base.html" %}
{% block content %}
<section class="page-banner"><div class="container"><h1>Activities</h1>
<nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="{{ url_for('index') }}">Home</a></li><li class="breadcrumb-item active">Activities</li></ol></nav></div></section>
<section class="section"><div class="container">
<div class="row g-4">
{% for a in activities %}
<div class="col-md-6 col-lg-4">
<div class="card-modern h-100">
{% if a.image_url %}<img src="{{ a.image_url }}" class="card-img-top" alt="{{ a.title }}" loading="lazy">{% endif %}
<div class="p-3">
<span class="badge bg-secondary mb-2">{{ a.category }}</span>
<h5>{{ a.title }}</h5>
<p class="text-muted small">{{ a.description }}</p>
</div></div></div>
{% else %}<p class="text-center text-muted">Activities will be listed here once published.</p>{% endfor %}
</div></div></section>
{% endblock %}
